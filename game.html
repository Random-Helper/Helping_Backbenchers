<!DOCTYPE html>
<html>
<head>
<title>Backbench Runner - Helping Backbenchers</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{margin:0;background:#87ceeb;font-family:Arial;text-align:center;overflow:hidden;}
h1{font-family:Poppins,Arial,sans-serif;}
#game{display:block;margin:auto;background:#bde9ff;border-bottom:8px solid #333;max-width:100%;}
button{padding:12px 20px;background:black;color:white;border:0;border-radius:8px;font-size:16px;}
</style>
</head>
<body>
<h1>🎮 Backbench Runner</h1>
<canvas id="game" width="900" height="400"></canvas>
<p>SPACE / TAP = JUMP</p>
<button onclick="restart()">🔄 Restart</button>
<script>
var canvas=document.getElementById("game");
var ctx=canvas.getContext("2d");
var player={
x:80,
y:300,
width:35,
height:50,
velocity:0,
jumping:false};
var obstacle={
x:900,
y:330,
width:35,
height:70};
var coin={
x:1100,
y:230,
size:12};
var score=0;
var gameOver=false;
var speed=6;
function jump(){
if(!player.jumping&&!gameOver){
player.velocity=-13;
player.jumping=true;}}
document.addEventListener("keydown",function(e){
if(e.code==="Space"){
e.preventDefault();
jump();
}});
canvas.addEventListener("touchstart",function(){
jump();});
canvas.addEventListener("click",function(){
jump();});
function drawPlayer(){
ctx.fillStyle="#222";
ctx.fillRect(player.x+8,player.y-15,20,20);
ctx.fillStyle="#315c99";
ctx.fillRect(player.x+5,player.y+5,25,25);
ctx.fillStyle="#222";
ctx.fillRect(player.x+5,player.y+30,8,20);
ctx.fillRect(player.x+22,player.y+30,8,20);
ctx.fillStyle="#f5c6a5";
ctx.fillRect(player.x+12,player.y-12,4,4);
ctx.fillRect(player.x+21,player.y-12,4,4);}
function drawObstacle(){
ctx.fillStyle="#8b5a2b";
ctx.fillRect(obstacle.x,obstacle.y,obstacle.width,obstacle.height);}
function drawCoin(){
ctx.fillStyle="#ffd700";
ctx.beginPath();
ctx.arc(coin.x,coin.y,coin.size,0,Math.PI*2);
ctx.fill();}
function update(){
if(gameOver)return;
player.velocity+=0.7;
player.y+=player.velocity;
if(player.y>=300){
player.y=300;
player.velocity=0;
player.jumping=false;}
obstacle.x-=speed;
coin.x-=speed;
if(obstacle.x<-50){
obstacle.x=900+Math.random()*300;
score++;
speed+=0.15;}
if(coin.x<-30){
coin.x=1000+Math.random()*500;
coin.y=180+Math.random()*100;}
if(
player.x<obstacle.x+obstacle.width &&
player.x+player.width>obstacle.x &&
player.y+player.height>obstacle.y
){gameOver=true;}
if(
player.x<coin.x+coin.size &&
player.x+player.width>coin.x-coin.size &&
player.y<coin.y+coin.size &&
player.y+player.height>coin.y-coin.size
){score+=5;coin.x=1000+Math.random()*500;}}
function draw(){
ctx.clearRect(0,0,canvas.width,canvas.height);
ctx.fillStyle="#fff";
ctx.font="22px Arial";
ctx.fillText("Score: "+score,20,35);
ctx.fillStyle="#6ab04c";
ctx.fillRect(0,350,900,50);
drawPlayer();
drawObstacle();
drawCoin();
if(gameOver){
ctx.fillStyle="rgba(0,0,0,0.7)";
ctx.fillRect(0,0,900,400);
ctx.fillStyle="white";
ctx.font="40px Arial";
ctx.fillText("GAME OVER",330,180);
ctx.font="22px Arial";
ctx.fillText("Score: "+score,390,220);
ctx.fillText("Press Restart",370,260);}}
function gameLoop(){
update();
draw();
requestAnimationFrame(gameLoop);}
function restart()
{player.y=300;
player.velocity=0;
player.jumping=false;
obstacle.x=900;
coin.x=1100;
score=0;
speed=6;
gameOver=false;}
gameLoop();
</script>
</body>
</html>
