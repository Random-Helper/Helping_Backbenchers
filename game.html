<!DOCTYPE html>
<html>
<head>
<title>Backbench Runner - Helping Backbenchers</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
.back{display:inline-block;margin:20px;padding:10px 18px;background:black;color:white;text-decoration:none;border-radius:8px;}
body{margin:0;background:linear-gradient(#63b8ff,#dff6ff);font-family:Arial;text-align:center;overflow:hidden;}
h1{font-family:Poppins,Arial,sans-serif;}
#game{display:block;margin:20px auto 0;background:linear-gradient(#8ed6ff 0%,#dff7ff 70%,#9bd36a 70%,#79b94d 100%);border:4px solid #222;border-radius:12px;max-width:95%;box-shadow:0 8px 20px rgba(0,0,0,.25);}
button{padding:12px 20px;background:black;color:white;border:0;border-radius:8px;font-size:16px;}
</style>
</head>
<body>
<h1>🎮 Backbench Runner</h1>
<canvas id="game" width="900" height="400"></canvas>
  <a class="back" href="index.html">← Back to Home</a>
<p>SPACE / TAP = JUMP</p>
<button onclick="restart()">🔄 Restart</button>
<script>
var canvas=document.getElementById("game");
var ctx=canvas.getContext("2d");
var player={
x:80,
y:285,
width:45,
height:65,
velocity:0,
jumping:false};
var obstacle={
x:900,
y:330,
width:35,
height:70};
var coin={
x:1100,
y:230,
size:12};
var score=0;
var gameOver=false;
var speed=6;
function jump(){
if(!player.jumping&&!gameOver){
player.velocity=-13;
player.jumping=true;}}
document.addEventListener("keydown",function(e){
if(e.code==="Space"){
e.preventDefault();
jump();
}});
canvas.addEventListener("touchstart",function(){
jump();});
canvas.addEventListener("click",function(){
jump();});
function drawPlayer(){

var x=player.x;
var y=player.y;

/* Shadow */
ctx.fillStyle="rgba(0,0,0,0.18)";
ctx.beginPath();
ctx.ellipse(x+23,y+67,22,5,0,0,Math.PI*2);
ctx.fill();

/* Hair */
ctx.fillStyle="#252525";
ctx.fillRect(x+9,y-23,27,7);
ctx.fillRect(x+5,y-17,35,12);
ctx.fillRect(x+9,y-27,20,5);

/* Face */
ctx.fillStyle="#f3c39f";
ctx.fillRect(x+10,y-5,27,23);

/* Ears */
ctx.fillRect(x+7,y,4,10);
ctx.fillRect(x+36,y,4,10);

/* Eyes */
ctx.fillStyle="#222";
ctx.fillRect(x+16,y+3,4,5);
ctx.fillRect(x+28,y+3,4,5);

/* Hair fringe */
ctx.fillStyle="#252525";
ctx.fillRect(x+9,y-8,8,7);
ctx.fillRect(x+27,y-8,10,7);

/* Shirt */
ctx.fillStyle="#3b69a6";
ctx.fillRect(x+7,y+18,31,27);

/* Shirt collar */
ctx.fillStyle="#31598d";
ctx.fillRect(x+17,y+18,11,5);

/* Arms */
ctx.fillStyle="#f3c39f";
ctx.fillRect(x+1,y+20,7,21);
ctx.fillRect(x+37,y+20,7,21);

/* Hands */
ctx.fillRect(x+1,y+39,7,6);
ctx.fillRect(x+37,y+39,7,6);

/* Pants */
ctx.fillStyle="#292929";
ctx.fillRect(x+9,y+45,12,19);
ctx.fillRect(x+25,y+45,12,19);

/* Shoes */
ctx.fillStyle="#f1f1f1";
ctx.fillRect(x+5,y+62,17,6);
ctx.fillRect(x+24,y+62,17,6);
}
function drawObstacle(){
ctx.fillStyle="#8b5a2b";
ctx.fillRect(obstacle.x,obstacle.y,obstacle.width,obstacle.height);}
function drawCoin(){
ctx.fillStyle="#ffd700";
ctx.beginPath();
ctx.arc(coin.x,coin.y,coin.size,0,Math.PI*2);
ctx.fill();}
function update(){
if(gameOver)return;
player.velocity+=0.7;
player.y+=player.velocity;
if(player.y>=300){
player.y=300;
player.velocity=0;
player.jumping=false;}
obstacle.x-=speed;
coin.x-=speed;
if(obstacle.x<-50){
obstacle.x=900+Math.random()*300;
score++;
speed+=0.15;}
if(coin.x<-30){
coin.x=1000+Math.random()*500;
coin.y=180+Math.random()*100;}
if(
player.x<obstacle.x+obstacle.width &&
player.x+player.width>obstacle.x &&
player.y+player.height>obstacle.y
){gameOver=true;}
if(
player.x<coin.x+coin.size &&
player.x+player.width>coin.x-coin.size &&
player.y<coin.y+coin.size &&
player.y+player.height>coin.y-coin.size
){score+=5;coin.x=1000+Math.random()*500;}}
function draw(){
ctx.clearRect(0,0,canvas.width,canvas.height);
ctx.fillStyle="#fff";
ctx.font="22px Arial";
ctx.fillText("Score: "+score,20,35);
ctx.fillStyle="#6ab04c";
ctx.fillRect(0,350,900,50);
drawPlayer();
drawObstacle();
drawCoin();
if(gameOver){
ctx.fillStyle="rgba(0,0,0,0.7)";
ctx.fillRect(0,0,900,400);
ctx.fillStyle="white";
ctx.font="40px Arial";
ctx.fillText("GAME OVER",330,180);
ctx.font="22px Arial";
ctx.fillText("Score: "+score,390,220);
ctx.fillText("Press Restart",370,260);}}
function gameLoop(){
update();
draw();
requestAnimationFrame(gameLoop);}
function restart()
{player.y=300;
player.velocity=0;
player.jumping=false;
obstacle.x=900;
coin.x=1100;
score=0;
speed=6;
gameOver=false;}
gameLoop();
</script>
</body>
</html>
